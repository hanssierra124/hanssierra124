name: Actualizar tarjetas de estadísticas

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días a las 06:00 UTC
  workflow_dispatch:       # botón "Run workflow" para lanzarlo a mano
  push:
    paths: ["scripts/**", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar tarjetas
        run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Actualizar tarjetas de estadísticas"
          git push
